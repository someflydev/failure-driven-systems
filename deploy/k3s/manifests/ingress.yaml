apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: opledger-api
  namespace: opledger
  labels:
    app.kubernetes.io/name: opledger-api
    app.kubernetes.io/part-of: opledger
  annotations:
    # Prefix routing includes /metrics. Set OPLEDGER_METRICS_ACCESS_TOKEN and
    # add network controls before using this public ingress for real traffic.
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - host: api.opledger.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: opledger-api
                port:
                  name: http
