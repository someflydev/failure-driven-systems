apiVersion: apps/v1
kind: Deployment
metadata:
  name: opledger-worker
  namespace: opledger
  labels:
    app.kubernetes.io/name: opledger-worker
    app.kubernetes.io/part-of: opledger
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opledger-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opledger-worker
        app.kubernetes.io/part-of: opledger
    spec:
      containers:
        - name: worker
          image: ghcr.io/YOUR_ORG/opledger:TAG
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - python
            - -m
            - opledger_api.worker
          envFrom:
            - configMapRef:
                name: opledger-config
            - secretRef:
                name: opledger-secrets
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
