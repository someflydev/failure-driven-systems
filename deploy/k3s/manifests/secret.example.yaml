apiVersion: v1
kind: Secret
metadata:
  name: opledger-secrets
  namespace: opledger
  labels:
    app.kubernetes.io/part-of: opledger
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@POSTGRES_HOST:5432/opledger
  OPLEDGER_REDIS_URL: redis://REDIS_HOST:6379/0
  OPLEDGER_METRICS_ACCESS_TOKEN: REPLACE_WITH_RANDOM_TOKEN
