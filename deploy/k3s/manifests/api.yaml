apiVersion: apps/v1
kind: Deployment
metadata:
  name: opledger-api
  namespace: opledger
  labels:
    app.kubernetes.io/name: opledger-api
    app.kubernetes.io/part-of: opledger
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opledger-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opledger-api
        app.kubernetes.io/part-of: opledger
    spec:
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/opledger:TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: opledger-config
            - secretRef:
                name: opledger-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opledger-api
  namespace: opledger
  labels:
    app.kubernetes.io/name: opledger-api
    app.kubernetes.io/part-of: opledger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opledger-api
  ports:
    - name: http
      port: 8000
      targetPort: http
