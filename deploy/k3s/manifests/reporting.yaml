apiVersion: apps/v1
kind: Deployment
metadata:
  name: opledger-reporting
  namespace: opledger
  labels:
    app.kubernetes.io/name: opledger-reporting
    app.kubernetes.io/part-of: opledger
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: opledger-reporting
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opledger-reporting
        app.kubernetes.io/part-of: opledger
    spec:
      containers:
        - name: reporting
          image: ghcr.io/YOUR_ORG/opledger:TAG
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - --no-sync
            - uvicorn
            - reporting_service.main:app
            - --app-dir
            - services/reporting
            - --host
            - 0.0.0.0
            - --port
            - "8001"
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: opledger-config
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 75m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: opledger-reporting
  namespace: opledger
  labels:
    app.kubernetes.io/name: opledger-reporting
    app.kubernetes.io/part-of: opledger
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opledger-reporting
  ports:
    - name: http
      port: 8001
      targetPort: http
